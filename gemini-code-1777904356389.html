<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Oasis of Kings</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <div class="logo">Oasis <span>of Kings</span></div>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html" class="cta-button">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <section class="page-header">
        <h1>Contact Us</h1>
        <p>Ready to build your digital kingdom? Let's grow together.</p>
    </section>

    <section class="contact-container">
        <form class="contact-form">
            <input type="text" placeholder="Your Name" required>
            <input type="email" placeholder="Your Email" required>
            <select>
                <option value="web-dev">Web Development</option>
                <option value="web-design">Web Design</option>
                <option value="seo">SEO Management</option>
            </select>
            <textarea placeholder="Your Message" rows="5" required></textarea>
            <button type="submit" class="btn">Send Message</button>
        </form>
    </section>

    <footer>
        <p>&copy; 2026 Oasis of Kings. All rights reserved.</p>
    </footer>
</body>
</html>
